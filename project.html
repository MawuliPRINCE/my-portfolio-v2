<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Project — Ismael Asumanu Prince</title>
<meta name="description" content="Case study by Ismael Asumanu Prince.">
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' fill='%23000'/><text y='.9em' font-size='80' font-family='serif' fill='%23ff4500'>P</text></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@300;400;500;600;700&family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
:root{
  --bg:#f6f1e8;--surface:#f2f0ec;--text:#111;--muted:#8a8378;
  --border:#e0d8c9;--accent:#ff4500;--accent-light:rgba(255,69,0,0.08);
  --card-bg:#fbf8f2;--modal-bg:#f6f1e8;
}
body.dark{
  --bg:#0d0d0d;--surface:#161616;--text:#f0ede8;--muted:#6b6357;
  --border:#2a2a2a;--card-bg:#131313;--modal-bg:#0d0d0d;
}
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
body{font-family:'Space Grotesk',sans-serif;background:var(--bg);color:var(--text);min-height:100vh;overflow-x:hidden;transition:background .3s,color .3s;}
img,video{max-width:100%;display:block;}

/* Header */
.site-header{position:fixed;top:0;left:0;width:100%;z-index:100;display:flex;align-items:center;justify-content:space-between;padding:clamp(14px,2.5vw,20px) clamp(20px,4vw,40px);background:color-mix(in srgb,var(--bg) 92%,transparent);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-bottom:1px solid var(--border);}
.logo{color:var(--accent);font-size:clamp(17px,2vw,22px);font-weight:700;text-decoration:none;}
.header-right{display:flex;align-items:center;gap:6px;}
.icon-btn{width:38px;height:38px;border-radius:50%;border:none;background:none;color:var(--text);font-size:17px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:color .2s,background .2s;}
.icon-btn:hover{color:var(--accent);background:var(--accent-light);}
.hamburger .fa-bars{display:block;}
.hamburger .fa-times{display:none;}
.hamburger.open .fa-bars{display:none;}
.hamburger.open .fa-times{display:block;}
.menu-backdrop{position:fixed;inset:0;background:rgba(0,0,0,0.4);backdrop-filter:blur(4px);z-index:98;opacity:0;pointer-events:none;transition:opacity .3s;}
.menu-backdrop.open{opacity:1;pointer-events:all;}
.menu{position:fixed;top:0;right:-100%;width:min(300px,85vw);height:100vh;background:var(--bg);display:flex;flex-direction:column;justify-content:center;align-items:center;transition:right .35s;z-index:99;}
.menu.open{right:0;}
.menu ul{list-style:none;text-align:center;width:100%;padding:0 2rem;}
.menu li{margin:4px 0;}
.menu a{color:var(--text);text-decoration:none;font-size:clamp(17px,3.5vw,21px);font-weight:500;display:block;padding:13px 20px;border-radius:8px;}
.menu a:hover,.menu a.active{color:var(--accent);background:var(--accent-light);}
.menu-divider{width:36px;height:2px;background:var(--accent);margin-bottom:2rem;}
.menu-footer{position:absolute;bottom:2rem;font-size:.65rem;color:var(--muted);text-transform:uppercase;letter-spacing:.1em;}

/* Hero */
.project-hero{padding:clamp(100px,15vw,160px) clamp(20px,5vw,80px) clamp(40px,6vw,60px);border-bottom:1px solid var(--border);position:relative;overflow:hidden;max-width:1400px;margin:0 auto;}
.back-link{display:inline-flex;align-items:center;gap:.5rem;font-size:.65rem;font-weight:600;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);text-decoration:none;margin-bottom:2rem;transition:color .2s;}
.back-link:hover{color:var(--accent);}
.project-title{font-family:'Cormorant Garamond',serif;font-size:clamp(40px,7vw,90px);font-weight:600;line-height:1;letter-spacing:-.02em;margin-bottom:1rem;}
.project-subtitle{font-size:clamp(1rem,2vw,1.4rem);color:var(--muted);font-weight:300;max-width:800px;line-height:1.6;margin-bottom:2rem;}
.project-meta{display:flex;flex-wrap:wrap;gap:1rem;font-size:.65rem;letter-spacing:.15em;text-transform:uppercase;color:var(--muted);}
.project-meta .tag{color:var(--accent);background:var(--accent-light);padding:4px 12px;border-radius:2px;font-weight:600;}

/* Content */
.project-content{max-width:900px;margin:0 auto;padding:clamp(40px,6vw,80px) clamp(20px,5vw,40px);}
.project-description{font-size:clamp(1.05rem,2vw,1.25rem);line-height:1.85;font-weight:300;color:var(--text);position:relative;}
.project-description h3{font-family:'Cormorant Garamond',serif;font-size:2rem;font-weight:600;margin:2.5rem 0 1rem;}
.project-description p{margin-bottom:1.5rem;}
.project-description ul{list-style-position:inside;margin-bottom:1.5rem;}
.project-description li{margin-bottom:.5rem;}
.project-description a{color:var(--accent);text-decoration:underline;}

/* Truncation */
.desc-clamped{max-height:160px;overflow:hidden;}
.desc-clamped::after{content:'';position:absolute;bottom:0;left:0;width:100%;height:100px;background:linear-gradient(transparent,var(--bg));pointer-events:none;}
.read-more-container{text-align:center;margin-top:1rem;}
.read-more-btn{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:.6rem 1.2rem;border-radius:30px;font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;transition:all .2s;}
.read-more-btn:hover{border-color:var(--accent);color:var(--accent);}

/* Gallery & Animations */
.project-gallery{max-width:1400px;margin:0 auto;padding:0 clamp(20px,5vw,80px) clamp(80px,10vw,120px);}
.gallery-grid{columns: 3 300px; column-gap: clamp(20px,4vw,40px);}

.reveal { opacity: 0; transform: translateY(40px); transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1), transform 0.8s cubic-bezier(0.16, 1, 0.3, 1); }
.reveal.active { opacity: 1; transform: translateY(0); }

.gallery-item{break-inside: avoid; margin-bottom: clamp(20px,4vw,40px); border:1px solid var(--border); background:var(--surface); border-radius:16px; overflow:hidden; display: block; cursor: zoom-in;}
.gallery-item img,.gallery-item video{width:100%; height:auto; display:block; transition: transform 0.3s ease;}
.gallery-item:hover img,.gallery-item:hover video{ transform: scale(1.02); }

/* Navigation (Next/Prev) */
.project-nav{max-width:900px; margin:0 auto 80px; padding:0 clamp(20px,5vw,40px); display:flex; justify-content:space-between; align-items:center; border-top:1px solid var(--border); padding-top:2rem;}
.project-nav a{text-decoration:none; color:var(--text); display:flex; flex-direction:column; gap:.3rem; transition:color .2s;}
.project-nav a:hover{color:var(--accent);}
.project-nav .nav-label{font-size:.6rem; letter-spacing:.15em; text-transform:uppercase; color:var(--muted);}
.project-nav .nav-title{font-family:'Cormorant Garamond',serif; font-size:1.5rem; font-weight:600;}
.project-nav .nav-next{text-align:right;}

/* Footer */
.archive-footer{border-top:1px solid var(--border);padding:clamp(40px,6vw,60px) clamp(20px,5vw,80px);display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:1rem;font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);}
.archive-footer a{color:var(--accent);text-decoration:none;}
.archive-footer a:hover{text-decoration:underline;}

/* Loading / Error state */
.loading-state{display:flex;flex-direction:column;align-items:center;justify-content:center;height:100vh;gap:1rem;color:var(--muted);}
.spinner{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--accent);border-radius:50%;animation:spin 1s linear infinite;}
@keyframes spin{to{transform:rotate(360deg);}}

/* LIGHTBOX - RECONSTRUCTED FOR RELIABILITY */
.lightbox { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
.lightbox.open { opacity: 1; pointer-events: all; }

/* The dark background layer */
.lightbox-backdrop { position: absolute; inset: 0; background: rgba(10,10,10,0.95); backdrop-filter: blur(10px); cursor: zoom-out; z-index: 1; }

/* The container for the image */
.lightbox-content { position: relative; z-index: 2; pointer-events: none; max-width: 90vw; max-height: 90vh; display: flex; align-items: center; justify-content: center; }
.lightbox-content img, .lightbox-content video { pointer-events: auto; max-width: 90vw; max-height: 90vh; object-fit: contain; border-radius: 4px; box-shadow: 0 20px 60px rgba(0,0,0,0.5); }

/* Buttons float above everything */
.lightbox-close { position: absolute; top: 2rem; right: 2rem; background: none; border: none; color: #fff; font-size: 2.5rem; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; z-index: 10; }
.lightbox-close:hover { opacity: 1; }
.lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: #fff; width: 50px; height: 50px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; font-size: 1.2rem; transition: all 0.2s; z-index: 10; }
.lightbox-nav:hover { background: var(--accent); border-color: var(--accent); }
.lightbox-nav.prev { left: 2rem; }
.lightbox-nav.next { right: 2rem; }

@media (max-width: 768px) {
  .lightbox-nav { width: 40px; height: 40px; font-size: 1rem; }
  .lightbox-nav.prev { left: 1rem; }
  .lightbox-nav.next { right: 1rem; }
  .lightbox-close { top: 1rem; right: 1rem; }
}

@view-transition { navigation: auto; }
::view-transition-old(root), ::view-transition-new(root) { animation-duration: 0.3s; }
</style>
</head>
<body>

<div class="menu-backdrop" id="menu-backdrop" onclick="closeMenu()"></div>

<header class="site-header">
  <a href="index.html" class="logo">Prince</a>
  <div class="header-right">
    <button class="icon-btn" onclick="toggleTheme()" aria-label="Toggle theme"><i class="fas fa-lightbulb"></i></button>
    <button class="icon-btn hamburger" id="hamburger" onclick="toggleMenu()" aria-label="Menu">
      <i class="fas fa-bars"></i><i class="fas fa-times"></i>
    </button>
  </div>
</header>

<nav class="menu" id="menu">
  <div class="menu-divider"></div>
  <ul>
    <li><a href="index.html" onclick="closeMenu()">Home</a></li>
    <li><a href="about.html" onclick="closeMenu()">About</a></li>
    <li><a href="projects.html" class="active" onclick="closeMenu()">Projects</a></li>
    <li><a href="archive.html" onclick="closeMenu()">Archive</a></li>
    <li><a href="booking.html" onclick="closeMenu()">Book Me</a></li>
  </ul>
  <p class="menu-footer">© <span id="menu-year"></span> Prince</p>
</nav>

<main id="app">
  <div class="loading-state" id="loading">
    <div class="spinner"></div>
    <p>Loading project...</p>
  </div>
</main>

<footer class="archive-footer">
  <span>© <span id="footer-year"></span> Ismael Asumanu Prince</span>
  <span><a href="projects.html">View all projects →</a></span>
</footer>

<!-- LIGHTBOX -->
<div class="lightbox" id="lightbox">
  <!-- This empty div handles the click-to-close entirely by itself -->
  <div class="lightbox-backdrop" onclick="closeLightbox()"></div>
  
  <div class="lightbox-content" id="lightbox-content"></div>
  
  <button class="lightbox-close" onclick="closeLightbox()"><i class="fas fa-times"></i></button>
  <button class="lightbox-nav prev" onclick="changeMedia(-1)"><i class="fas fa-arrow-left"></i></button>
  <button class="lightbox-nav next" onclick="changeMedia(1)"><i class="fas fa-arrow-right"></i></button>
</div>

<script>
document.getElementById('menu-year').textContent = new Date().getFullYear();
document.getElementById('footer-year').textContent = new Date().getFullYear();

const USER='MawuliPRINCE';
const REPO='my-portfolio-v2';
const JSON_URL=`https://raw.githubusercontent.com/${USER}/${REPO}/main/projects.json`;

// ===== THEME & MENU =====
function toggleTheme(){ const dark=document.body.classList.contains('dark'); document.body.className=dark?'light':'dark'; localStorage.setItem('theme',dark?'light':'dark'); }
(function(){ const saved=localStorage.getItem('theme'); if(saved==='dark')document.body.classList.add('dark'); else if(saved==='light')document.body.classList.remove('dark'); else if(window.matchMedia('(prefers-color-scheme: dark)').matches)document.body.classList.add('dark'); })();

const menuEl=document.getElementById('menu'),backdrop=document.getElementById('menu-backdrop'),hamBtn=document.getElementById('hamburger');
function openMenu(){menuEl.classList.add('open');backdrop.classList.add('open');hamBtn.classList.add('open');document.body.style.overflow='hidden';}
function closeMenu(){menuEl.classList.remove('open');backdrop.classList.remove('open');hamBtn.classList.remove('open');document.body.style.overflow='';}
function toggleMenu(){menuEl.classList.contains('open')?closeMenu():openMenu();}

// ===== HELPERS =====
function isVideoUrl(url){return /\.(mp4|webm|mov|ogg)(\?|$)/i.test(url)||url.includes('/video/upload/');}
function makeVideoWebSafe(url){ if(!url||typeof url!=='string')return url; if(!url.includes('/video/upload/'))return url; if(/vc_/.test(url))return url; return url.replace('/video/upload/','/video/upload/vc_auto/'); }
function clOpt(url){ if(!url)return url; if(url.includes('res.cloudinary.com')&&url.includes('/upload/')&&!url.includes('q_auto')){ return url.replace('/upload/','/upload/q_auto,f_auto,w_auto/'); } return url; }

// ===== TRUNCATE TOGGLE =====
window.toggleDesc = function() {
  const content = document.getElementById('desc-content');
  const btn = document.getElementById('read-more-btn');
  if(!content || !btn) return;
  if (content.classList.contains('desc-clamped')) {
    content.classList.remove('desc-clamped');
    btn.innerHTML = 'Show Less ↑';
  } else {
    content.classList.add('desc-clamped');
    btn.innerHTML = 'Continue Reading ↓';
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
};

// ===== SCROLL ANIMATIONS =====
const observer = new IntersectionObserver((entries) => {
  entries.forEach(entry => {
    if (entry.isIntersecting) {
      entry.target.classList.add('active');
      observer.unobserve(entry.target);
    }
  });
}, { threshold: 0.1 });

// ===== LIGHTBOX LOGIC =====
let currentMediaList = [];
let currentMediaIndex = 0;
const lightboxEl = document.getElementById('lightbox');

window.openLightbox = function(index) {
  currentMediaIndex = index;
  renderLightboxMedia();
  lightboxEl.classList.add('open');
  document.body.style.overflow = 'hidden'; // Lock background scroll
};

window.closeLightbox = function() {
  lightboxEl.classList.remove('open');
  document.getElementById('lightbox-content').innerHTML = '';
  document.body.style.overflow = ''; 
};

window.changeMedia = function(dir) {
  if (!currentMediaList.length) return;
  currentMediaIndex = (currentMediaIndex + dir + currentMediaList.length) % currentMediaList.length;
  renderLightboxMedia();
};

function renderLightboxMedia() {
  const m = currentMediaList[currentMediaIndex];
  if(!m) return;
  const isVid = m.type === 'video' || isVideoUrl(m.url);
  const container = document.getElementById('lightbox-content');
  
  if (isVid) {
    container.innerHTML = `<video src="${makeVideoWebSafe(m.url)}" controls autoplay loop playsinline></video>`;
  } else {
    container.innerHTML = `<img src="${clOpt(m.url)}" alt="Media preview">`;
  }
}

// ===== MOBILE SWIPE =====
let touchStartX = 0;
let touchEndX = 0;

lightboxEl.addEventListener('touchstart', e => {
    touchStartX = e.changedTouches[0].screenX;
}, {passive: true});

lightboxEl.addEventListener('touchend', e => {
    touchEndX = e.changedTouches[0].screenX;
    if (touchEndX < touchStartX - 50) changeMedia(1); // Swipe left
    if (touchEndX > touchStartX + 50) changeMedia(-1); // Swipe right
}, {passive: true});

// ===== KEYBOARD NAVIGATION =====
let currentProjectId = null;
let prevUrl = null;
let nextUrl = null;

document.addEventListener('keydown', (e) => {
  const isLightboxOpen = lightboxEl.classList.contains('open');
  
  if (isLightboxOpen) {
    if (e.key === 'ArrowLeft') changeMedia(-1);
    if (e.key === 'ArrowRight') changeMedia(1);
    if (e.key === 'Escape') closeLightbox();
  } else {
    if (e.key === 'ArrowLeft' && prevUrl) window.location.href = prevUrl;
    if (e.key === 'ArrowRight' && nextUrl) window.location.href = nextUrl;
  }
});

// ===== LOAD PAGE =====
window.addEventListener('DOMContentLoaded', async () => {
  const params = new URLSearchParams(window.location.search);
  currentProjectId = params.get('id');
  
  if(!currentProjectId){ document.getElementById('app').innerHTML = `<div class="loading-state"><h2>Project not found</h2><a href="projects.html" style="color:var(--accent);">Back to projects</a></div>`; return; }

  try {
    const res = await fetch(JSON_URL + '?t=' + Date.now());
    const allProjects = await res.json();
    const project = allProjects.find(p => p.id === currentProjectId);
    
    if(!project) { document.getElementById('app').innerHTML = `<div class="loading-state"><h2>Project not found</h2><a href="projects.html" style="color:var(--accent);">Back to projects</a></div>`; return; }

    const currentIndex = allProjects.findIndex(p => p.id === currentProjectId);
    if(currentIndex > 0) prevUrl = 'project.html?id=' + allProjects[currentIndex - 1].id;
    if(currentIndex < allProjects.length - 1) nextUrl = 'project.html?id=' + allProjects[currentIndex + 1].id;

    document.title = (project.seoTitle || project.title) + ' — Ismael Asumanu Prince';
    const metaDesc = document.querySelector('meta[name="description"]');
    if(metaDesc) metaDesc.setAttribute('content', project.seoDescription || project.subtitle || 'Case study by Ismael Asumanu Prince');

    const media = (project.media || []).filter(m => m.url);
    currentMediaList = media; 
    
    const desc = (project.description || '<p>No description provided.</p>').replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');

    const html = `
      <section class="project-hero">
        <a href="projects.html" class="back-link"><i class="fas fa-arrow-left"></i> Back to Projects</a>
        <h1 class="project-title">${project.title || 'Untitled'}</h1>
        ${project.subtitle ? `<p class="project-subtitle">${project.subtitle}</p>` : ''}
        <div class="project-meta">
          ${project.year ? `<span>${project.year}</span>` : ''}
          ${(project.tags||[]).map(t=>`<span class="tag">${t}</span>`).join('')}
        </div>
      </section>

      <section class="project-content">
        <div class="project-description">
          <div id="desc-content" class="desc-clamped">${desc}</div>
          <div class="read-more-container" id="read-more-wrap" style="display:none;">
            <button class="read-more-btn" id="read-more-btn" onclick="toggleDesc()">Continue Reading ↓</button>
          </div>
        </div>
        ${project.clientTestimonial ? `<div style="margin-top:3rem;padding:2rem;border-left:3px solid var(--accent);background:var(--accent-light);font-family:'Cormorant Garamond',serif;font-size:1.5rem;font-style:italic;">“${project.clientTestimonial}”</div>` : ''}
      </section>

      ${media.length ? `
      <section class="project-gallery">
        <div class="gallery-grid">
          ${media.map((m, index) => {
            const isVid = m.type === 'video' || isVideoUrl(m.url);
            return `<div class="gallery-item reveal" onclick="openLightbox(${index})">
              ${isVid 
                ? `<video src="${makeVideoWebSafe(m.url)}" muted loop autoplay playsinline disablepictureinpicture></video>`
                : `<img src="${clOpt(m.url)}" alt="${project.title} preview" loading="lazy">`}
            </div>`;
          }).join('')}
        </div>
      </section>` : ''}
      
      <div class="project-nav">
        ${prevUrl ? `<a href="${prevUrl}"><span class="nav-label"><i class="fas fa-arrow-left"></i> Previous</span><span class="nav-title">${allProjects[currentIndex - 1].title}</span></a>` : `<div></div>`}
        ${nextUrl ? `<a href="${nextUrl}" class="nav-next"><span class="nav-label">Next <i class="fas fa-arrow-right"></i></span><span class="nav-title">${allProjects[currentIndex + 1].title}</span></a>` : `<div></div>`}
      </div>
    `;

    document.getElementById('app').innerHTML = html;

    setTimeout(() => {
      const descContent = document.getElementById('desc-content');
      const wrap = document.getElementById('read-more-wrap');
      if (descContent && wrap && descContent.scrollHeight > descContent.clientHeight) {
        wrap.style.display = 'block';
      }
    }, 100);

    document.querySelectorAll('.reveal').forEach(el => observer.observe(el));

  } catch(e) {
    console.error(e);
    document.getElementById('app').innerHTML = `<div class="loading-state"><h2>Error loading project</h2><p>Please try again later.</p><a href="projects.html" style="color:var(--accent);">Back to projects</a></div>`;
  }
});
</script>
</body>
</html>
